#Sets the number of worker processes NGINX will use.
worker_processes 1;

events {
    worker_connections 1024;      #Defines how many simultaneous connections each worker can handle.

http {
    #Rate limit: 10 requests per second per IP
    limit_req_zone $binary_remote_addr zone=mylimit:10m rate=10r/s;

    #Round-robin load balancer between app1 and app2
    upstream backend {
        server app1:5000;
        server app2:5000;
    }
    #Nginx listens on port 8080
    server {
        listen 8080;

        #Enables basic authentication
        auth_basic "Restricted Area";
        auth_basic_user_file /etc/nginx/.htpasswd;

        location / {
	    #Applies rate limiting and forwards requests to backend
            limit_req zone=mylimit burst=5;
            proxy_pass http://backend;
        }
    }
}
